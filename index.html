<!DOCTYPE html>

<head>

    <div class="container">

        <h1>This is heading 1</h1>

</html>


<!DOCTYPE html>
<html>
<head>
    <title>Exercise 13 - CSS Transitions</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f2f2;
            padding-top: 60px;
        }

        h1 {
            color: #333;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 120px;
            margin-top: 80px;
        }

        .box {
            width: 150px;
            height: 150px;
            transition: all 0.6s ease;
        }

        /* Square 1 */
        .box1 {
            background-color: red;
        }

        .box1:hover {
            width: 300px;
        }

        /* Square 2 */
        .box2 {
            background-color: blue;
        }

        .box2:hover {
            transform: scale(1.5);
        }

        p {
            color: #555;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    

    <p>Move your mouse over the squares to see the effects.</p>

    <div class="container">

        <div>
            <div class="box box1"></div>
            
        </div>

        <div>
            <div class="box box2"></div>
            
        </div>

    </div>

</body>
</html>
